# Reusable query parameters

PageNumber:
  name: page[number]
  in: query
  description: Page number (1-based)
  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  name: page[size]
  in: query
  description: Number of items per page
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25

Sort:
  name: sort
  in: query
  description: |
    Comma-separated sort fields. Prefix with `-` for descending.
    Example: `name`, `-createdAt`, `type,-createdAt`
  schema:
    type: string

Include:
  name: include
  in: query
  description: |
    Comma-separated related resources to sideload via compound documents.
    Example: `session,sound`
  schema:
    type: string

FilterRole:
  name: filter[role]
  in: query
  description: Filter users by role
  schema:
    type: string
    enum: [admin, morning_user, afternoon_user]

FilterFileType:
  name: filter[fileType]
  in: query
  description: Filter audio files by type
  schema:
    type: string
    enum: [bell, anthem, school_song, other]

FilterSessionId:
  name: filter[sessionId]
  in: query
  description: Filter schedule items by session ID
  schema:
    type: string
    format: uuid

FilterDay:
  name: filter[day]
  in: query
  description: "Filter schedule items by day of the week (1=Sunday through 7=Saturday)"
  schema:
    type: integer
    minimum: 1
    maximum: 7

FieldsAudioFiles:
  name: fields[audio-files]
  in: query
  description: Sparse fieldset — comma-separated attribute names to return
  schema:
    type: string
