    paths_audio_yaml__collection:
      get:
        operationId: listAudioFiles
        summary: List audio files
        description: Returns a paginated collection of audio file metadata.
        tags:
          - Audio
        security:
          - BearerAuth: []
        parameters:
          - $ref: ../parameters.yaml#/PageNumber
          - $ref: ../parameters.yaml#/PageSize
          - $ref: ../parameters.yaml#/Sort
          - $ref: ../parameters.yaml#/FilterFileType
          - $ref: ../parameters.yaml#/FieldsAudioFiles
        responses:
          "200":
            description: Audio file collection
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/AudioFileCollectionDocument
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "500":
            $ref: ../responses.yaml#/InternalServerError
      post:
        operationId: uploadAudioFile
        summary: Upload audio file
        description: |
          Accepts multipart/form-data (not JSON:API) because file uploads
          require binary streaming.
        tags:
          - Audio
        security:
          - BearerAuth: []
        requestBody:
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  file:
                    type: string
                    format: binary
                    description: The audio file to upload
                  name:
                    type: string
                    description: Display name for the audio file
                    example: bell.mp3
                  type:
                    type: string
                    enum:
                      - bell
                      - anthem
                      - school_song
                      - other
                    description: Audio file category
                    example: bell
                required:
                  - file
                  - name
                  - type
          required: true
        responses:
          "201":
            description: Audio file uploaded
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/AudioFileDocument
          "400":
            $ref: ../responses.yaml#/BadRequest
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "403":
            $ref: ../responses.yaml#/Forbidden
          "415":
            $ref: ../responses.yaml#/UnsupportedMediaType
          "422":
            $ref: ../responses.yaml#/UnprocessableEntity
          "500":
            $ref: ../responses.yaml#/InternalServerError
    checksums:
      get:
        operationId: listAudioChecksums
        summary: Get audio file checksums
        description: |
          Public endpoint for client sync. Returns a minimal JSON:API collection
          with only file type and checksum attributes.
        tags:
          - Audio
        responses:
          "200":
            description: Audio file checksums
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/AudioChecksumDocument
          "500":
            $ref: ../responses.yaml#/InternalServerError
    paths_audio_yaml__item:
      get:
        operationId: getAudioFileById
        summary: Get audio file metadata
        description: |
          Public endpoint. Returns JSON:API metadata for the audio file.
          Use `/audio/{id}/content` to download the binary.
        tags:
          - Audio
        responses:
          "200":
            description: Audio file metadata
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/AudioFileDocument
          "404":
            $ref: ../responses.yaml#/NotFound
          "500":
            $ref: ../responses.yaml#/InternalServerError
      put:
        operationId: updateAudioFile
        summary: Update audio file metadata
        description: Updates the name or type of an existing audio file.
        tags:
          - Audio
        security:
          - BearerAuth: []
        requestBody:
          content:
            application/vnd.api+json:
              schema:
                $ref: ../schemas/requests.yaml#/AudioFileUpdateRequest
          required: true
        responses:
          "200":
            description: Audio file updated
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/AudioFileDocument
          "400":
            $ref: ../responses.yaml#/BadRequest
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "403":
            $ref: ../responses.yaml#/Forbidden
          "404":
            $ref: ../responses.yaml#/NotFound
          "422":
            $ref: ../responses.yaml#/UnprocessableEntity
          "500":
            $ref: ../responses.yaml#/InternalServerError
      delete:
        operationId: deleteAudioFile
        summary: Delete audio file
        description: Permanently removes an audio file and its binary content.
        tags:
          - Audio
        security:
          - BearerAuth: []
        responses:
          "204":
            description: Audio file deleted
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "403":
            $ref: ../responses.yaml#/Forbidden
          "404":
            $ref: ../responses.yaml#/NotFound
          "500":
            $ref: ../responses.yaml#/InternalServerError
      parameters:
        - name: id
          in: path
          description: Audio file UUID
          required: true
          schema:
            type: string
            format: uuid
    content:
      get:
        operationId: downloadAudioContent
        summary: Download audio file content
        description: |
          Public endpoint. Streams the binary audio content.
          Content-Type is determined by the file extension.
          Content-Disposition header includes the filename.
        tags:
          - Audio
        responses:
          "200":
            description: Audio file binary
            headers:
              Content-Disposition:
                description: Attachment header with filename
                schema:
                  type: string
                  example: 'attachment; filename="bell.wav"'
            content:
              audio/*:
                schema:
                  type: string
                  format: binary
              application/octet-stream:
                schema:
                  type: string
                  format: binary
          "404":
            $ref: ../responses.yaml#/NotFound
          "500":
            $ref: ../responses.yaml#/InternalServerError
      parameters:
        - name: id
          in: path
          description: Audio file UUID
          required: true
          schema:
            type: string
            format: uuid
    state:
      get:
        operationId: getSystemState
        summary: Get system state
        description: |
          Public endpoint. Returns whether the bell system is active or paused.
        tags:
          - System
        responses:
          "200":
            description: Current system state
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/SystemStateDocument
          "500":
            $ref: ../responses.yaml#/InternalServerError
      post:
        operationId: setSystemState
        summary: Set system state
        description: Sets the bell system state to active or paused.
        tags:
          - System
        security:
          - BearerAuth: []
        requestBody:
          content:
            application/vnd.api+json:
              schema:
                $ref: ../schemas/requests.yaml#/SystemStateRequest
          required: true
        responses:
          "200":
            description: System state updated
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/SystemStateDocument
          "400":
            $ref: ../responses.yaml#/BadRequest
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "403":
            $ref: ../responses.yaml#/Forbidden
          "422":
            $ref: ../responses.yaml#/UnprocessableEntity
          "500":
            $ref: ../responses.yaml#/InternalServerError
    cancel-next-bell:
      post:
        operationId: cancelNextBell
        summary: Cancel next scheduled bell
        description: Prevents the next scheduled bell from playing.
        tags:
          - System
        security:
          - BearerAuth: []
        responses:
          "204":
            description: Next bell cancelled
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "403":
            $ref: ../responses.yaml#/Forbidden
          "404":
            description: No pending bell to cancel
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/jsonapi.yaml#/ErrorResponse
          "500":
            $ref: ../responses.yaml#/InternalServerError
