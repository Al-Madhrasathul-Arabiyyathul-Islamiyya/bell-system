openapi: 3.2.0
info:
  title: Bell Schedule System API
  version: 1.0.0
  description: |
    Backend API for managing school bell schedules and audio playback.

    This API follows JSON:API v1.1 for CRUD resource endpoints. Authentication,
    binary download, and read-model endpoints are documented exceptions that use
    plain JSON request/response bodies but still return JSON:API error envelopes
    on failure.
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
tags:
  - name: Authentication
    description: |
      User authentication endpoints. These are documented JSON:API exceptions —
      they use plain JSON request/response bodies.
  - name: Users
    description: User management (admin only)
  - name: Sessions
    description: Session management (morning/afternoon)
  - name: Schedule
    description: Schedule management endpoints
  - name: Audio
    description: System audio file management
  - name: System
    description: System status and control
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /auth/login
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: securepass123
      required:
        - username
        - password
      description: Plain JSON login request (documented JSON:API exception)
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/UserResource'
      description: Plain JSON login response with JWT token and user resource
    UserResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - users
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/UserAttributes'
        links:
          $ref: '#/components/schemas/SelfLink'
      required:
        - type
        - id
        - attributes
      description: A JSON:API user resource
    UserAttributes:
      type: object
      properties:
        username:
          type: string
          example: admin
        role:
          type: string
          enum:
            - admin
            - morning_user
            - afternoon_user
          example: admin
        createdAt:
          type: string
          format: date-time
          example: "2026-03-20T10:00:00Z"
      description: User resource attributes
    SelfLink:
      type: object
      properties:
        self:
          type: string
      required:
        - self
      description: Object containing a self-referencing link
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiError'
          example:
            - status: "400"
              code: invalid_request
              title: Invalid request
              detail: invalid JSON body
      required:
        - errors
      description: JSON:API error document containing one or more errors
    JsonApiError:
      type: object
      properties:
        status:
          type: string
          description: HTTP status code as a string
          example: "400"
        code:
          type: string
          description: Stable machine-readable error code
          example: invalid_request
        title:
          type: string
          description: Short human-readable summary
          example: Invalid request
        detail:
          type: string
          description: Detailed explanation
          example: invalid JSON body
        source:
          type: object
          properties:
            pointer:
              type: string
              description: JSON pointer to the request body field
              example: /data/attributes/password
            parameter:
              type: string
              description: Query parameter that caused the error
              example: "filter[role]"
          description: Pointer to the source of the error in the request
      required:
        - status
        - code
        - title
      description: A single JSON:API error object
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - oldPassword
        - newPassword
      description: Plain JSON change-password request (documented JSON:API exception)
    UserCollectionDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
      required:
        - data
        - meta
        - links
      description: Paginated user collection document
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 125
        page:
          type: object
          properties:
            number:
              type: integer
              example: 2
            size:
              type: integer
              example: 25
            pages:
              type: integer
              example: 5
          required:
            - number
            - size
            - pages
      required:
        - total
        - page
      description: Pagination metadata for paginated collections
    PaginationLinks:
      type: object
      properties:
        self:
          type: string
          example: /api/v1/audio?page[number]=2&page[size]=25
        first:
          type: string
          example: /api/v1/audio?page[number]=1&page[size]=25
        prev:
          type: string
          example: /api/v1/audio?page[number]=1&page[size]=25
        next:
          type: string
          example: /api/v1/audio?page[number]=3&page[size]=25
        last:
          type: string
          example: /api/v1/audio?page[number]=5&page[size]=25
      required:
        - self
        - first
        - last
      description: Pagination navigation links
    UserCreateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - users
            attributes:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  minLength: 8
                  example: securepass123
                role:
                  type: string
                  enum:
                    - admin
                    - morning_user
                    - afternoon_user
                  example: admin
              required:
                - username
                - password
                - role
          required:
            - type
            - attributes
      required:
        - data
      description: Request body for creating a user
    UserDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserResource'
      required:
        - data
      description: Single user resource document
    UserUpdateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - users
            attributes:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                    - admin
                    - morning_user
                    - afternoon_user
          required:
            - type
      required:
        - data
      description: Request body for updating a user (all attributes optional)
    SessionCollectionDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionResource'
        meta:
          $ref: '#/components/schemas/UnpaginatedMeta'
        links:
          $ref: '#/components/schemas/SelfLink'
      required:
        - data
        - meta
        - links
      description: Unpaginated session collection document
    SessionResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - sessions
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/SessionAttributes'
        links:
          $ref: '#/components/schemas/SelfLink'
      required:
        - type
        - id
        - attributes
      description: A JSON:API session resource
    SessionAttributes:
      type: object
      properties:
        name:
          type: string
          example: Morning
        startTime:
          type: string
          description: Start time in HH:MM format
          example: "08:00"
        endTime:
          type: string
          description: End time in HH:MM format
          example: "12:00"
      description: Session resource attributes
    UnpaginatedMeta:
      type: object
      properties:
        total:
          type: integer
          example: 3
      required:
        - total
      description: Metadata for unpaginated (small, bounded) collections
    SessionCreateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - sessions
            attributes:
              type: object
              properties:
                name:
                  type: string
                  example: Morning
                startTime:
                  type: string
                  example: "08:00"
                endTime:
                  type: string
                  example: "12:00"
              required:
                - name
                - startTime
                - endTime
          required:
            - type
            - attributes
      required:
        - data
      description: Request body for creating a session
    SessionDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SessionResource'
      required:
        - data
      description: Single session resource document
    SessionUpdateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - sessions
            attributes:
              type: object
              properties:
                name:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
          required:
            - type
      required:
        - data
      description: Request body for updating a session (all attributes optional)
    CurrentScheduleResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionResource'
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                example: First Bell
              time:
                type: string
                example: "07:00"
              sound:
                type:
                  - object
                  - "null"
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    example: bell.mp3
                  checksum:
                    type: string
                description: The audio file associated with this bell
              status:
                type: string
                enum:
                  - pending
                  - current
                  - completed
                example: pending
            description: A schedule item in the current schedule
      description: |
        Documented JSON:API exception. Returns the active session with its
        schedule items for the current day.
    ScheduleItemCollectionDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItemResource'
        meta:
          $ref: '#/components/schemas/UnpaginatedMeta'
        links:
          $ref: '#/components/schemas/SelfLink'
        included:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/SessionResource'
              - $ref: '#/components/schemas/AudioFileResource'
          description: Sideloaded related resources when ?include is used
      required:
        - data
        - meta
        - links
      description: Unpaginated schedule-item collection document
    ScheduleItemResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - schedule-items
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/ScheduleItemAttributes'
        relationships:
          type: object
          properties:
            session:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/NullableSessionRelationshipData'
              description: The session this schedule item belongs to
            sound:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/AudioFileRelationshipData'
              required:
                - data
              description: The audio file played when this bell fires
          description: Related session and sound resources
        links:
          $ref: '#/components/schemas/SelfLink'
      required:
        - type
        - id
        - attributes
      description: A JSON:API schedule-item resource with session and sound relationships
    ScheduleItemAttributes:
      type: object
      properties:
        name:
          type: string
          example: First Bell
        time:
          type: string
          description: Bell time in HH:MM format
          example: "07:00"
        days:
          type: array
          items:
            type: integer
            maximum: 7
            minimum: 1
          description: Days of the week (1=Sunday through 7=Saturday)
          example: [2, 3, 4, 5, 6]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Schedule item resource attributes
    NullableSessionRelationshipData:
      type:
        - object
        - "null"
      properties:
        type:
          type: string
          enum:
            - sessions
        id:
          type: string
          format: uuid
      required:
        - type
        - id
      description: Nullable resource identifier for a session relationship (null clears the relationship)
    AudioFileRelationshipData:
      type: object
      properties:
        type:
          type: string
          enum:
            - audio-files
        id:
          type: string
          format: uuid
      required:
        - type
        - id
      description: Resource identifier for an audio-files relationship
    AudioFileResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - audio-files
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/AudioFileAttributes'
        links:
          type: object
          properties:
            self:
              type: string
              example: /api/v1/audio/uuid
            content:
              type: string
              description: URL to download the binary audio content
              example: /api/v1/audio/uuid/content
          description: Resource links including binary content download URL
      required:
        - type
        - id
        - attributes
      description: A JSON:API audio-file resource
    AudioFileAttributes:
      type: object
      properties:
        name:
          type: string
          example: bell.mp3
        fileType:
          type: string
          enum:
            - bell
            - anthem
            - school_song
            - other
          example: bell
        checksum:
          type: string
          description: SHA-256 checksum of the file
          example: "a1b2c3d4e5f6..."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Audio file resource attributes
    ScheduleItemCreateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - schedule-items
            attributes:
              type: object
              properties:
                name:
                  type: string
                  example: First Bell
                time:
                  type: string
                  example: "07:00"
                days:
                  type: array
                  items:
                    type: integer
                    maximum: 7
                    minimum: 1
                  example: [2, 3, 4, 5, 6]
              required:
                - name
                - time
                - days
            relationships:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NullableSessionRelationshipData'
                  description: The session this item belongs to (nullable)
                sound:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AudioFileRelationshipData'
                  required:
                    - data
                  description: The audio file to play
              description: Related session and sound for this schedule item
          required:
            - type
            - attributes
            - relationships
      required:
        - data
      description: Request body for creating a schedule item
    ScheduleItemDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ScheduleItemResource'
        included:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/SessionResource'
              - $ref: '#/components/schemas/AudioFileResource'
          description: Sideloaded related resources when ?include is used
      required:
        - data
      description: Single schedule-item resource document (may include sideloaded resources)
    ScheduleItemUpdateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - schedule-items
            attributes:
              type: object
              properties:
                name:
                  type: string
                time:
                  type: string
                days:
                  type: array
                  items:
                    type: integer
                    maximum: 7
                    minimum: 1
            relationships:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NullableSessionRelationshipData'
                sound:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AudioFileRelationshipData'
              description: Updated session and/or sound relationships
          required:
            - type
      required:
        - data
      description: Request body for updating a schedule item (all fields optional)
    AudioFileCollectionDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AudioFileResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
      required:
        - data
        - meta
        - links
      description: Paginated audio-file collection document
    AudioFileDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AudioFileResource'
      required:
        - data
      description: Single audio-file resource document
    AudioChecksumDocument:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AudioChecksumResource'
      required:
        - data
      description: Collection of minimal audio-file resources for client sync
    AudioChecksumResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - audio-files
        id:
          type: string
          format: uuid
        attributes:
          type: object
          properties:
            fileType:
              type: string
              enum:
                - bell
                - anthem
                - school_song
                - other
            checksum:
              type: string
          description: Minimal attributes for client sync
      required:
        - type
        - id
        - attributes
      description: A minimal audio-file resource with only checksum attributes
    AudioFileUpdateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - audio-files
            attributes:
              type: object
              properties:
                name:
                  type: string
                fileType:
                  type: string
                  enum:
                    - bell
                    - anthem
                    - school_song
                    - other
          required:
            - type
      required:
        - data
      description: Request body for updating audio file metadata
    SystemStateDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SystemStateResource'
      required:
        - data
      description: Single system-state resource document
    SystemStateResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - system-state
        id:
          type: string
          description: Always "current"
          example: current
        attributes:
          $ref: '#/components/schemas/SystemStateAttributes'
      required:
        - type
        - id
        - attributes
      description: A JSON:API system-state resource
    SystemStateAttributes:
      type: object
      properties:
        state:
          type: string
          enum:
            - active
            - paused
          example: active
        lastUpdated:
          type: string
          format: date-time
      description: System state resource attributes
    SystemStateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - system-state
            attributes:
              type: object
              properties:
                state:
                  type: string
                  enum:
                    - active
                    - paused
                  example: active
              required:
                - state
          required:
            - type
            - attributes
      required:
        - data
      description: Request body for setting system state
  responses:
    BadRequest:
      description: Malformed or unparseable request
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Semantic validation failure
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. duplicate username)
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Wrong Content-Type header
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    PageNumber:
      name: page[number]
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page[size]
      in: query
      description: Number of items per page
      schema:
        type: integer
        maximum: 100
        minimum: 1
        default: 25
    Sort:
      name: sort
      in: query
      description: |
        Comma-separated sort fields. Prefix with `-` for descending.
        Example: `name`, `-createdAt`, `type,-createdAt`
      schema:
        type: string
    FilterRole:
      name: filter[role]
      in: query
      description: Filter users by role
      schema:
        type: string
        enum:
          - admin
          - morning_user
          - afternoon_user
    FilterSessionId:
      name: filter[sessionId]
      in: query
      description: Filter schedule items by session ID
      schema:
        type: string
        format: uuid
    FilterDay:
      name: filter[day]
      in: query
      description: Filter schedule items by day of the week (1=Sunday through 7=Saturday)
      schema:
        type: integer
        maximum: 7
        minimum: 1
    Include:
      name: include
      in: query
      description: |
        Comma-separated related resources to sideload via compound documents.
        Example: `session,sound`
      schema:
        type: string
    FilterFileType:
      name: filter[fileType]
      in: query
      description: Filter audio files by type
      schema:
        type: string
        enum:
          - bell
          - anthem
          - school_song
          - other
    FieldsAudioFiles:
      name: fields[audio-files]
      in: query
      description: Sparse fieldset — comma-separated attribute names to return
      schema:
        type: string
  pathItems:
    login:
      post:
        operationId: loginUser
        summary: Authenticate user
        description: |
          Documented JSON:API exception. Uses plain JSON request/response.
          Returns a JWT token and user resource on success.
        tags:
          - Authentication
        requestBody:
          content:
            application/json:
              schema:
                $ref: ../schemas/exceptions.yaml#/LoginRequest
          required: true
        responses:
          "200":
            description: Successful login
            content:
              application/json:
                schema:
                  $ref: ../schemas/exceptions.yaml#/LoginResponse
          "400":
            $ref: ../responses.yaml#/BadRequest
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "500":
            $ref: ../responses.yaml#/InternalServerError
    change-password:
      post:
        operationId: changePassword
        summary: Change password
        description: |
          Documented JSON:API exception. Uses plain JSON request body.
          Returns 204 on success, JSON:API errors on failure.
        tags:
          - Authentication
        security:
          - BearerAuth: []
        requestBody:
          content:
            application/json:
              schema:
                $ref: ../schemas/exceptions.yaml#/ChangePasswordRequest
          required: true
        responses:
          "204":
            description: Password changed successfully
          "400":
            $ref: ../responses.yaml#/BadRequest
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "422":
            $ref: ../responses.yaml#/UnprocessableEntity
          "500":
            $ref: ../responses.yaml#/InternalServerError
    logout:
      post:
        operationId: logout
        summary: Logout
        description: |
          Documented JSON:API exception. Invalidates the current session.
          Returns 204 with no body.
        tags:
          - Authentication
        security:
          - BearerAuth: []
        responses:
          "204":
            description: Logged out successfully
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "500":
            $ref: ../responses.yaml#/InternalServerError
    collection:
      get:
        operationId: listUsers
        summary: List all users
        description: Admin only. Returns a paginated collection of users.
        tags:
          - Users
        security:
          - BearerAuth: []
        parameters:
          - $ref: ../parameters.yaml#/PageNumber
          - $ref: ../parameters.yaml#/PageSize
          - $ref: ../parameters.yaml#/Sort
          - $ref: ../parameters.yaml#/FilterRole
        responses:
          "200":
            description: User collection
            content:
              application/vnd.api+json:
                schema:
                  $ref: ../schemas/resources.yaml#/UserCollectionDocument
          "401":
            $ref: ../responses.yaml#/Unauthorized
          "403":
            $ref: ../responses.yaml#/Forbidden
          "500":
