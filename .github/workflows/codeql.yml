# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master", "develop" ]
    paths:
      - "bell-system-backend/**"
      - "admin-client/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [ "master", "develop" ]
    paths:
      - "bell-system-backend/**"
      - "admin-client/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: '44 23 * * 6'

jobs:
  changes:
    name: Detect CodeQL Scope
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      pull-requests: read
    outputs:
      admin-client: ${{ steps.filter.outputs.admin-client }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'bell-system-backend/**'
            admin-client:
              - 'admin-client/**'

  analyze-backend:
    name: Analyze (go)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  analyze-admin-client:
    name: Analyze (javascript-typescript)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.admin-client == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
