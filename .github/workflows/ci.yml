name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

defaults:
  run:
    working-directory: bell-system-backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: bell-system-backend/go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Check go.mod tidiness
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak > /dev/null || ! diff -q go.sum go.sum.bak > /dev/null; then
            echo "go.mod or go.sum is not tidy"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: bell-system-backend/go.sum

      - name: Run tests with coverage
        run: |
          COVERPKGS="arabiyya.edu.mv/bell-system-backend/cmd/...,arabiyya.edu.mv/bell-system-backend/config,arabiyya.edu.mv/bell-system-backend/internal/...,arabiyya.edu.mv/bell-system-backend/pkg/..."
          go test ./... -v -count=1 -race -coverprofile=unit.out -coverpkg="$COVERPKGS"

      - name: Print coverage summary
        run: go tool cover -func=unit.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: bell-system-backend/unit.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: bell-system-backend/go.sum

      - name: Build server
        run: go build ./cmd/server

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: bell-system-backend/go.sum

      - name: Run integration tests with coverage
        run: |
          COVERPKGS="arabiyya.edu.mv/bell-system-backend/cmd/...,arabiyya.edu.mv/bell-system-backend/config,arabiyya.edu.mv/bell-system-backend/internal/...,arabiyya.edu.mv/bell-system-backend/pkg/..."
          go test -tags integration -v -count=1 -timeout 300s \
            -coverprofile=integration.out -coverpkg="$COVERPKGS" \
            ./tests/integration/

      - name: Print integration coverage summary
        run: go tool cover -func=integration.out | tail -1

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: bell-system-backend/integration.out
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
